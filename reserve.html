<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva - Construmec Santo Tomé</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>
</head>
<body class="reservation-page">
  <header class="header">
    <nav class="nav">
      <div class="logo-container">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <img src="Imagen%20de%20WhatsApp%202025-01-28%20a%20las%2012.14.40_1ddaf352.jpg" alt="Logo" class="logo-image">
          <a href="index.html" class="logo">CONSTRUMEC<span>SANTO TOMÉ</span></a>
        </div>
        <div class="company-info">
          <p>Calle Candiotti 2315, Santo Tomé, Santa Fe</p>
          <p>Tel: 3794866210</p>
        </div>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="back-button">Volver al Inicio</a></li>
        <li><a href="index.html#catalogo">Catálogo</a></li>
        <li><a href="index.html#como-funciona">Cómo funciona</a></li>
        <li><a href="index.html#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="reservation-container">
    <section>
      <div class="section-header">
        <h2>Formulario de Reserva</h2>
      </div>
      <form id="email-reservation-form" onsubmit="sendReservationEmail(event)">
        <div class="form-group">
          <label for="equipment">Equipo a reservar:</label>
          <select id="equipment" name="equipment" required>
            <option value="">Seleccione un equipo</option>
            <option value="Generador Lusqtoff LG7500EX">Generador Lusqtoff LG7500EX</option>
            <option value="Rotomartillo Demoledor DeWalt">Rotomartillo Demoledor DeWalt</option>
            <option value="Motobomba Lusqtoff 3\"">Motobomba Lusqtoff 3"</option>
            <option value="Vibroapisonador">Vibroapisonador</option>
            <option value="Desmalezadora Profesional">Desmalezadora Profesional</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dates">Fechas de alquiler:</label>
          <input type="text" id="dates" name="dates" required>
        </div>
        <div class="form-group">
          <label for="name">Nombre completo:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="dni">DNI:</label>
          <input type="text" id="dni" name="dni" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Teléfono:</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-group">
          <label for="comments">Comentarios adicionales:</label>
          <textarea id="comments" name="comments" rows="4"></textarea>
        </div>
        <button type="submit" class="submit-button">Enviar Reserva</button>
      </form>
    </section>
  </main>

  <script src="reserve.js"></script>
</body>
</html>
